<!DOCTYPE html>
<html>
<head>
    <title>Speech to Text - Speech Platform</title>
    <link rel="stylesheet" type="text/css" href="style.css">

    <style>
        #transcriptionBox {
            border: 2px solid #000000;
            padding: 10px;
            margin-top: 20px;
            min-height: 100px;
            width: 300px; /* Adjust the width as needed */
            overflow: auto; /* Ensures the box will scroll if content overflows */
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="index.html" style="color:White;">Speech Platform</a></div>
        <nav>
            <a href="speech-to-text.html">Speech to Text</a>
            <a href="text-to-speech.html">Text to Speech</a>
            <a href="databases.html">Databases</a>
            <a href="resources.html">Resources</a>
        </nav>
    </header>

    <main>
        <h1>Speech to Text</h1>
        <p>Welcome to the Speech to Text services.</p><br><br>

        <form>
            <label>Select the transcription mode</label><br>
            <select>
                <option value="real">Real-Time</option>
                <option value="file">File-based</option>
            </select><br><br>
        </form>

        <table>
            <tr>
                <td>
                    <h2>Online</h2>
                </td>
                <td>
                    <h2>Offline</h2>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Google Cloud</h3>
                    <div style="border: 2px solid #000; padding: 10px; margin: 10px; width: 500px; height: 300px">                        
                    </div>                    
                </td>
                <td>
                    <h3>Vosk</h3>
                    <div style="border: 2px solid #000; padding: 10px; margin: 10px; width: 500px; height: 300px">                        
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Microsof Azure</h3>
                    <div style="border: 2px solid #000; padding: 10px; margin: 10px; width: 500px; height: 300px">                        
                    </div>                    
                </td>
                <td>
                    <h3>PicoVoice</h3>
                    <div style="border: 2px solid #000; padding: 10px; margin: 10px; width: 500px; height: 300px">                        
                    </div>
                </td>
            </tr>
        </table>

        <!-- Teste com o engine do "navegador?" -->
        <h1>Speech to Text App - v1</h1>
        <p>For early STT demonstration...</p>
        
        <button id="start">Start</button>
        <button id="stop">Stop</button>
            
        <p id="output"></p>
        
        <script>
          window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
          const recognition = new SpeechRecognition();
          recognition.interimResults = true;
    
          let p = document.createElement('p');
          const words = document.querySelector('#output');
          words.appendChild(p);
    
          recognition.addEventListener('result', e => {
            const transcript = Array.from(e.results)
              .map(result => result[0])
              .map(result => result.transcript)
              .join('');
    
            p.textContent = transcript;
            if (e.results[0].isFinal) {
              p = document.createElement('p');
              words.appendChild(p);
            }
          });
    
          document.querySelector('#start').addEventListener('click', () => {
            recognition.start();
          });
    
          document.querySelector('#stop').addEventListener('click', () => {
            recognition.stop();
          });
        </script>
        
        <br><br><br><br><br><br>
    </main>

    <footer>
        <a href="mailto:borghi@fe.up.pt" style="color:White;">Send email - borghi@fe.up.pt</a>
    </footer>
</body>
</html>
